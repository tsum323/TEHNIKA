# Публикация сайта на GitHub Pages после каждого обновления ветки main
# (то есть после слияния Pull Request). Можно запустить и вручную во вкладке Actions.
name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно выполняется только одна публикация.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Установить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json

      - name: Настроить GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Установить зависимости
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Проверка типов TypeScript
        run: npm run typecheck

      - name: Production-сборка
        run: npm run build
        env:
          # Подпапка сайта на GitHub Pages, например "/TEHNIKA".
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # --- Админ-панель: отдельное приложение в подпапке /admin/ ---
      - name: "Админ-панель: установить зависимости"
        working-directory: admin
        run: npm ci

      - name: "Админ-панель: ESLint и проверка типов"
        working-directory: admin
        run: npm run lint && npm run typecheck

      - name: "Админ-панель: сборка"
        working-directory: admin
        run: npm run build
        env:
          ADMIN_BASE_PATH: ${{ steps.pages.outputs.base_path }}/admin
          # Адрес базы и публичный ключ Supabase берутся из секретов репозитория
          # (Settings → Secrets and variables → Actions). Если секретов нет —
          # админ-панель публикуется в демо-режиме с ненастоящими данными.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Сложить сайт и админ-панель вместе
        run: cp -r admin/out out/admin

      - name: Загрузить готовый сайт
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
